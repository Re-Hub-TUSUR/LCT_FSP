<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1c21" />
    <meta
      name="description"
      content="КАДРЫ — платформа ФСП России: ИТ-специалисты один раз подтверждают грейд тестом, а компании сами приглашают их с открытой вилкой зарплаты."
    />
    <title>КАДРЫ — подбор ИТ-специалистов | ФСП России</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- The splash is painted before any bundle arrives, so its colours repeat tokens.css by value. -->
    <style>
      html {
        background: #1b1c21;
      }

      .splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #1b1c21;
        font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .splash--done {
        opacity: 0;
        pointer-events: none;
      }

      /* A short delay keeps the splash from flashing when everything is already cached. */
      .splash__mark,
      .splash__label {
        animation: splash-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
      }

      /* The ФСП sign «[•]»: blue brackets, a red dot that blinks while the app loads. */
      .splash__mark {
        display: flex;
        font-weight: 800;
        font-size: 44px;
        line-height: 1;
        color: #402fff;
      }

      .splash__dot {
        color: #ec1d35;
        animation: splash-dot 1.2s ease-in-out infinite;
      }

      .splash__label {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-indent: 0.16em;
        text-transform: uppercase;
        color: #9b9c9e;
      }

      @keyframes splash-in {
        from {
          opacity: 0;
        }
      }

      @keyframes splash-dot {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.15;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash__mark,
        .splash__label,
        .splash__dot {
          animation: none;
        }
      }
    </style>
    <noscript>
      <style>
        .splash {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!-- Held and dismissed by Splash in src/shared/ui/splash; the sign repeats FspMark of shared/ui. -->
    <div id="splash" class="splash" role="status">
      <span class="splash__mark" aria-hidden="true">[<span class="splash__dot">•</span>]</span>
      <span class="splash__label">Загрузка…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
