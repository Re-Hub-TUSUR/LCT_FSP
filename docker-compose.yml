# Local full stack: PostgreSQL + Elasticsearch + API + SPA (nginx proxies /api to the backend).
# Usage: cp .env.example .env  (fill JWT_SECRET and POSTGRES_PASSWORD), then `docker compose up --build`.
name: kadry

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kadry}
      POSTGRES_USER: ${POSTGRES_USER:-kadry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Candidate search for recruiters. ~1 GB RAM; without it the API searches the database.
  elasticsearch:
    image: elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # A nearly full laptop disk would otherwise switch the index to read-only.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    image: kadry-backend
    # Demo data is loaded once, into an empty database (`--if-missing` never blocks the start).
    command: sh -c "alembic upgrade head && python -m app.seed.assessment && python -m app.seed --if-missing && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kadry}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kadry}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      ONLINECOMPILER_API_KEY: ${ONLINECOMPILER_API_KEY:-}
      ONLINECOMPILER_URL: ${ONLINECOMPILER_URL:-https://api.onlinecompiler.io}
      # Password of the demo accounts created by `python -m app.seed`.
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      UPLOAD_DIR: /data/uploads
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:-}
      RESUME_PARSER_MODEL: ${RESUME_PARSER_MODEL:-openai/gpt-6-luna}
      # No colon: an empty value is passed on and switches reasoning off.
      RESUME_PARSER_REASONING: ${RESUME_PARSER_REASONING-low}
    volumes:
      - upload-data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      # Soft dependency: the API starts first and builds the index once the cluster is up.
      elasticsearch:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: kadry-frontend
    environment:
      BACKEND_UPSTREAM: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  db-data:
  es-data:
  upload-data:
