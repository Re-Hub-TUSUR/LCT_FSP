[project]
name = "kadry-backend"
version = "0.1.0"
description = "KADRY — IT recruitment platform API (FSP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "elasticsearch[async]>=9.5.1,<10",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "fpdf2>=2.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "C4", "SIM", "RUF", "PL", "PT", "FAST"]
ignore = [
  "PLR0913", # FastAPI endpoints legitimately take many injected dependencies
  "RUF001",  # Cyrillic strings are expected
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
# Task sources: Russian statements run past the line, generators are seeded on purpose.
"app/seed/code_bank/*" = ["E501", "S104", "S311", "PLR0917", "PLR2004"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations/env.py"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

# fpdf2 reads fonts with fontTools, which ships no type information.
[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"
