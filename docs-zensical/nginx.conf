server {
    listen 80;
    server_name localhost;

    # The image listens on 80, while Compose publishes another host port.
    # An absolute redirect would drop that port: /en -> http://localhost/en/.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
